name: Wake Word Request
description: Request a complete MWW, OWW, and NWW wake bundle for Tater satellites.
title: "mww: "
labels: ["wake-word-request"]
body:
  - type: markdown
    attributes:
      value: |
        Put the wake phrase after `mww:` in the issue title.

        Example: `mww: hey potato`

        The automation only trains issues whose title starts with `mww:`. A
        successful request publishes one Tater bundle with MWW, OWW, NWW-CNN,
        and NWW-GRU, plus the MWW-only ESPHome package.
  - type: input
    id: phrase
    attributes:
      label: Wake phrase
      description: "The phrase you want generated. Keep the issue title in `mww: phrase` format."
      placeholder: hey potato
    validations:
      required: false
  - type: checkboxes
    id: publication
    attributes:
      label: Publication agreement
      description: "The generated wake-word models and metadata will be published in this repository."
      options:
        - label: I agree that the generated artifacts may be published under the MIT License.
          required: true
