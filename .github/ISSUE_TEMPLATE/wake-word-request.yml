name: Wake Word Request
description: Request a complete MWW, OWW, NWW, and wake-boundary bundle for Tater satellites.
title: "mww: "
labels: ["wake-word-request"]
body:
  - type: markdown
    attributes:
      value: |
        Put the wake phrase after `mww:` in the issue title.

        Example: `mww: hey potato`

        The automation only trains issues whose title starts with `mww:`. A
        successful request publishes one Tater bundle with MWW, OWW, NWW-CNN,
        NWW-GRU, and a per-word wake-boundary model, plus the MWW-only ESPHome
        package.
  - type: input
    id: phrase
    attributes:
      label: Wake phrase
      description: "The phrase you want generated. Keep the issue title in `mww: phrase` format."
      placeholder: hey potato
    validations:
      required: false
  - type: checkboxes
    id: publication
    attributes:
      label: The Tater Totterson pact
      description: "Tater Totterson trains these wake-word bundles for free—no subscription and no potato tax. Generated models and metadata are published publicly under the MIT License."
      options:
        - label: I solemnly swear to keep my wallet closed and my tots crispy—no paying for wake-word training, now or ever.
          required: true
