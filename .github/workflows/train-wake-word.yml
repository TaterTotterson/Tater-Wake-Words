name: Train Wake Word Request
run-name: "mww #${{ inputs.issue_number }}"

# Automatic requests are handled by watcher.sh in the Apple trainer repository.
# Keep this workflow as a manual fallback without queuing self-hosted jobs for
# every new or edited issue.
on:
  workflow_dispatch:
    inputs:
      issue_number:
        description: Open wake-word request issue number to retry
        required: true
        type: string

permissions:
  contents: write
  issues: write

concurrency:
  group: tater-wake-word-${{ inputs.issue_number }}
  cancel-in-progress: false

jobs:
  train:
    runs-on: [self-hosted, macOS, ARM64, tater-wake-words]
    timeout-minutes: 360
    env:
      CATALOG_DIR: microWakeWordsV7
      GH_TOKEN: ${{ github.token }}
      GITHUB_TOKEN: ${{ github.token }}
      TATER_WAKE_EXTERNAL_ROOT: ${{ vars.TATER_WAKE_EXTERNAL_ROOT }}
      TATER_WAKE_TRAINER_DIR: ${{ vars.TATER_WAKE_TRAINER_DIR }}
      TATER_WAKE_TMP_ROOT: ${{ vars.TATER_WAKE_TMP_ROOT }}
      WAKE_WORD_ISSUE_NUMBER: ${{ inputs.issue_number }}
    steps:
      - name: Checkout catalog
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Train requested wake word
        run: scripts/train_issue_wake_word.sh
